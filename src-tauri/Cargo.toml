[package]
name = "loom-agent"
version = "0.1.0"
description = "Loom —— 个人本地 Coding Agent 桌面壳（Tauri）"
authors = ["Lucas"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "loom_agent_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
# 系统原生对话框（选目录/选文件/消息框）。
# ★ 为什么需要它：WebView 里拿不到真实路径（浏览器的安全模型只给 File 对象），
#   `window.prompt` 也不是"选目录"。桌面版要走 Rust 这边的系统对话框。
tauri-plugin-dialog = "2"
