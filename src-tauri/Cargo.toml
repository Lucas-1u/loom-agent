[package]
name = "loom-agent"
version = "0.1.0"
description = "Loom —— 个人本地 Coding Agent 桌面壳（Tauri）"
authors = ["Lucas"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "loom_agent_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
